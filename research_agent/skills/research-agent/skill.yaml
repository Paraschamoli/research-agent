id: research-agent-v1
name: research-agent
version: 1.0.0
author: paras25619@gmail.com

# Description
description: |
  Performs deep investigative research and journalism by combining real-time web search with professional reporting techniques.
  Capable of fact-checking, analyzing sources, and generating comprehensive reports in NYT-style, academic, or executive formats.

# Tags and Modes
tags:
  - research
  - investigative-journalism
  - fact-checking
  - web-search
  - article-analysis
  - reporting
  - data-analysis
  - ny-times-style

input_modes:
  - text/plain
  - application/json

output_modes:
  - text/plain
  - application/json
  - text/markdown

# Example Queries
examples:
  - "Research the impact of AI on healthcare diagnostics in the last 5 years"
  - "Investigate economic consequences of climate policies in Europe"
  - "Analyze recent developments in quantum computing applications"
  - "Ethical implications of CRISPR gene editing in human embryos"
  - "Compare renewable energy adoption in Germany, China, and the US"

# Detailed Capabilities
capabilities_detail:
  primary_capability:
    supported: true
    description: "Conducts investigative research with fact verification and report generation"
    features:
      - "Deep web search across news, papers, and official sources"
      - "Fact-checking with source cross-referencing and credibility scoring"
      - "Generates structured research reports in NYT, academic, executive, or detailed styles"
      - "Analyzes sources for bias, relevance, and recency"
      - "Provides confidence scores and recommendations"
    limitations: "Dependent on source availability; very recent or niche sources may be limited"

  secondary_capability:
    supported: true
    description: "Provides structured metadata, scoring, and trend insights from research"
    features:
      - "Labels sources and findings by credibility and relevance"
      - "Aggregates multi-source analysis into coherent reports"
      - "Tracks confidence, coverage, and depth level"
      - "Supports comparative and historical research across regions and topics"

# Requirements
requirements:
  packages:
    - agno>=2.2.0
    - bindu>=2026.1.7
    - duckduckgo-search>=7.1.0
    - newspaper4k>=0.1.1
    - openai>=1.60.0
    - python-dotenv>=1.0.1
  system:
    - "Internet access for web research"
  min_memory_mb: 512
  external_services:
    - DuckDuckGo Search API
    - OpenAI API or OpenRouter API

# Performance Metrics
performance:
  avg_processing_time_ms: 3000
  avg_time_per_source_ms: 500
  max_concurrent_requests: 5
  memory_per_request_mb: 512
  timeout_seconds: 120
  max_sources_per_query: 20
  scalability: horizontal

# Tool Restrictions
allowed_tools:
  - DuckDuckGoTools
  - Newspaper4kTools
  - Read
  - Search
  - Analyze
  - Generate

# Rich Documentation
documentation:
  overview: |
    Provides AI-driven investigative research and journalism capabilities.
    Combines web search with professional reporting, fact-checking, source analysis, and structured report generation.
    Excels at breaking down complex topics, analyzing multiple sources, and delivering well-structured, credible insights.

  use_cases:
    when_to_use:
      - "Research complex topics or emerging issues"
      - "Fact-check claims or information across multiple sources"
      - "Generate investigative or comparative reports"
      - "Analyze sources for credibility, bias, and recency"
      - "Obtain historical context alongside current developments"

    when_not_to_use:
      - "Simple Q&A without research requirement"
      - "Mathematical or financial calculations"
      - "Code generation or debugging"
      - "Personal advice or opinion-based responses"
      - "Live, real-time events or breaking news"
      - "Highly specialized scientific research without sources"

  input_structure: |
    Accepts investigative research queries in JSON or text format:

    {
      "query": "Topic or question",
      "depth": "quick|comprehensive|deep",
      "style": "nytimes|academic|executive|detailed",
      "sources": 5,
      "time_frame": "last_year|last_5_years|all_time",
      "focus_areas": ["technology", "policy", "economics"],
      "exclude_sources": ["specific_domains"]
    }

    Constraints:
    - Max query length: 500 characters
    - Max sources per query: 20
    - Timeout: 120 seconds
    - Language: English primary

  output_format: |
    Returns structured investigative research or fact-check reports:

    Research Report:
    - REPORT SUMMARY: Brief overview (<30 words)
    - TITLE: Generated report title
    - EXECUTIVE SUMMARY: Key findings
    - METHODOLOGY: Sources, search strategy, and depth
    - FINDINGS: For each finding:
      - KEY_FINDING: Main insight (<16 words)
      - SUPPORTING_EVIDENCE: List of source summaries
      - CONFIDENCE_SCORE: 0-1
    - ANALYSIS: Detailed connection of findings
    - CONCLUSIONS: Key takeaways
    - RECOMMENDATIONS: Suggested next steps or research areas
    - SOURCES: List with URL, title, credibility, relevance, summary
    - METADATA: Query, processing_time_ms, sources_analyzed, sources_used, depth_level

    Fact-Checking Report:
    - CLAIM: Original statement to verify
    - VERDICT: true|false|partially_true|unverified
    - CONFIDENCE_SCORE: 0-1
    - EVIDENCE: Sources supporting/contradicting claim
    - DETAILED_ANALYSIS: Explanation of verification
    - METADATA: Processing time, sources checked

  error_handling:
    - "No sources found: Returns informative message with search strategy attempted"
    - "Conflicting information: Provides balanced view with source credibility"
    - "Complex query timeout: Returns partial results with completion percentage"
    - "API rate limits: Suggests simpler queries or queues requests"
    - "Unclear query: Requests clarification"
    - "Sensitive topics: Handles with disclaimers and balanced reporting"

  examples:
    - title: "AI in Healthcare Research"
      input:
        query: "Impact of AI on healthcare diagnostics in the last 5 years"
        depth: "comprehensive"
        style: "academic"
        sources: 10
      output:
        report_summary: "AI revolutionizes diagnostics with notable accuracy and efficiency gains."
        findings: [...]
        sources: [...]
        metadata:
          processing_time_ms: 7800
          sources_analyzed: 15
          confidence_score: 0.91

    - title: "Climate Policy Economic Analysis"
      input:
        query: "Economic consequences of climate change policies in Europe"
        depth: "deep"
        style: "nytimes"
        time_frame: "last_10_years"
      output:
        report_summary: "European climate policies balance economic growth and green objectives."
        findings: [...]
        sources: [...]
        metadata:
          processing_time_ms: 12500
          sources_analyzed: 22

    - title: "CRISPR Ethics Fact Check"
      input:
        query: "Ethical implications of CRISPR gene editing in human embryos"
        depth: "comprehensive"
        style: "detailed"
      output:
        report_summary: "CRISPR raises profound ethical questions requiring careful societal debate."
        findings: [...]
        sources: [...]
        metadata:
          processing_time_ms: 6500
          sources_analyzed: 18

  best_practices:
    for_developers:
      - "Specify depth level for research intensity"
      - "Use style to match desired output format"
      - "Set reasonable source limits"
      - "Assess conflicting information via source credibility"
      - "Cache frequent queries to improve performance"
      - "Monitor API usage and implement rate limits"

    for_orchestrators:
      - "Route research-intensive queries here"
      - "Chain with summarization agents for executive briefings"
      - "Adjust timeout based on query complexity"
      - "Balance depth with response time requirements"
      - "Use confidence scores for quality assurance"
      - "Fallback to simpler research for urgent queries"
      - "Monitor source diversity to avoid bias"

  installation: |
    Required packages:
    pip install agno bindu duckduckgo-search newspaper4k openai python-dotenv

    Environment variables:
    OPENAI_API_KEY
    OPENROUTER_API_KEY  # Alternative to OpenAI

  versioning:
    - version: "1.0.0"
      date: "2026-01-11"
      changes: "Initial release with web search, investigative research, and report generation"
    - version: "1.1.0"
      status: "planned"
      changes: "Add academic database integration and citation management"
    - version: "1.2.0"
      status: "planned"
      changes: "Enhanced bias detection and multi-language research support"

# Assessment fields for skill negotiation
assessment:
  keywords:
    - research
    - investigate
    - journalism
    - fact-check
    - analysis
    - report
    - search
    - sources
    - evidence
    - verify
    - verification
    - investigative

  specializations:
    - domain: technology_research
      confidence_boost: 0.3
    - domain: policy_analysis
      confidence_boost: 0.3
    - domain: scientific_research
      confidence_boost: 0.2
    - domain: business_analysis
      confidence_boost: 0.2

  anti_patterns:
    - "simple question"
    - "basic answer"
    - "opinion"
    - "personal advice"
    - "mathematical calculation"
    - "code generation"
    - "real-time events"
    - "live updates"

  complexity_indicators:
    simple:
      - "quick overview"
      - "basic facts"
      - "definition"
      - "simple explanation"
    medium:
      - "research topic"
      - "compare options"
      - "analyze issue"
      - "multiple sources"
    complex:
      - "investigate claims"
      - "comprehensive report"
      - "deep research"
      - "fact checking"
      - "conflicting information"
